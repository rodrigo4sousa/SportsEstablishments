# Dependency updates (T06). Weekly, one grouped PR for minor and patch updates per ecosystem.
#
# Major updates are never grouped: each arrives as its own PR and is reviewed by hand (changelog, breaking changes,
# generated files such as the OpenAPI document and the API types). Frontend dependencies are pinned to exact versions
# and must be at least two weeks old (docs/backlog.md, US01), so `cooldown` holds back any release younger than that;
# the one exception, a security fix, is not delayed because security updates ignore the cooldown.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
