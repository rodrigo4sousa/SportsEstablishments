name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # The official install script, from builds.dotnet.microsoft.com, with the exact SDK of global.json. actions/setup-dotnet
      # resolves its downloads through aka.ms to dotnetorigin.blob.core.windows.net, which now answers 409
      # (PublicAccessNotPermitted; actions/setup-dotnet#794, v5 and v6 alike). An exact version skips the aka.ms lookup.
      - name: Install the .NET SDK
        working-directory: .
        run: |
          curl -sSfL https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test -c Release --no-build

      - name: OpenAPI document is up to date
        run: git diff --exit-code -- src/SportsBooking.Api/openapi

      - name: No EF Core model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/SportsBooking.Infrastructure --startup-project src/SportsBooking.Api --no-build --configuration Release

      - name: No vulnerable packages
        run: |
          dotnet package list --vulnerable --include-transitive --format json > vulnerable.json
          cat vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: API types are up to date with the OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api

      # Dev-only tooling (eslint-config-next) currently has advisories with no fix; production dependencies must be clean.
      - run: npm audit --omit=dev --audit-level=high

  diagrams:
    name: Docs (architecture diagrams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The PlantUML image tag is pinned in docs/architecture/style.puml; the script reads it, so the CI and a local render
      # always use the same version, and the font (DejaVu Sans) comes from that image.
      - name: Render the diagrams
        run: docs/architecture/render.sh

      # git status also catches a diagram whose .svg was never committed.
      - name: Rendered diagrams match the committed SVGs
        run: |
          if [ -n "$(git status --porcelain -- docs/architecture/out)" ]; then
            git status --short -- docs/architecture/out
            git diff --stat -- docs/architecture/out
            echo "::error::The .svg files are out of date. Run docs/architecture/render.sh (or render.ps1) and commit them."
            exit 1
          fi

      # Every SVG is in the README gallery exactly once, and relative links in docs/architecture resolve to a file.
      - name: Architecture docs are consistent
        run: scripts/check-architecture-docs.sh
