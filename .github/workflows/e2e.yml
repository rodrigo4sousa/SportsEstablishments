name: E2E

# End-to-end tests (Playwright, Chromium) against the real stack: the docker compose project of docker-compose.yml with the demo data.
# It is its own workflow, not a job of ci.yml: deploy.yml waits for the CI workflow only, so a slow or failing browser run never holds
# back a deploy. Locally: e2e/ and "Running the E2E tests" in the README.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      # The browser is cached by the exact Playwright version, which is pinned in e2e/package.json.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser files come from the cache, but the system libraries do not.
      - name: Install the system libraries of Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds the images, starts postgres, mailpit, the API and the site, and seeds the demo data (e2e/scripts/stack.mjs).
      - name: Start the stack
        run: npm run stack:up

      - name: Run the tests
        run: npm test

      - name: Upload the report, traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Logs of the stack
        if: failure()
        run: docker compose -p sportsbooking-e2e logs --no-color --tail 200
