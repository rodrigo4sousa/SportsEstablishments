name: CodeQL

# Code scanning for C# and JavaScript/TypeScript. It is its own workflow: deploy.yml waits for the CI workflow only, so a slow or
# failing scan never holds back a deploy. Both languages use build-mode none (no build, so no .NET install is needed here).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads the results
      actions: read # only needed by the upload step in a private repository (GitHub's own template asks for it)
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
