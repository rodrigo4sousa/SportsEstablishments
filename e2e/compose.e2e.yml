# Used only by the E2E tests (see ../README.md, "Running the E2E tests"): the database and Mailpit are not published on the host,
# so this stack does not clash with a development stack that already uses port 5432. The site (3000) and the API (5080) keep their
# ports: the API's origin check allows exactly those two in Development.
services:
  postgres:
    ports: !reset []
  mailpit:
    ports: !reset []
  api:
    environment:
      # Every browser of a run shares one client address: at the real limit (10 a minute), a second run or a CI retry within the same
      # minute would get 429 at login. The limits have their own integration tests.
      RateLimiting__Auth__LoginPermitLimit: "100"
