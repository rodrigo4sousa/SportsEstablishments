# Local development stack: docker compose up --build
# Values come from .env (copy .env.example); the defaults below are for local use only.
name: sportsbooking

# The API as the Next.js server sees it: used at build time (rewrites) and at run time (server-side session checks).
x-api-internal-url: &api_internal_url http://api:8080

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsbooking}
      POSTGRES_USER: ${POSTGRES_USER:-sportsbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsbooking}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sportsbooking};Username=${POSTGRES_USER:-sportsbooking};Password=${POSTGRES_PASSWORD:-sportsbooking};GSS Encryption Mode=Disable
      # Admin account created at startup (US04); empty means no admin. Set them in .env, never in this file.
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      # US22: emails go to Mailpit (web UI on :8025), never to real addresses.
      Email__Host: mailpit
      Email__Port: "1025"
      Email__Security: None
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: *api_internal_url
    environment:
      API_INTERNAL_URL: *api_internal_url
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
