kout</text><path d="M379.242,309.438 L379.242,340.703 L359.242,344.703 L379.242,348.703 L379.242,379.969 A0,0 0 0 0 379.242,379.969 L762.42,379.969 A0,0 0 0 0 762.42,379.969 L762.42,319.438 L752.42,309.438 L379.242,309.438 A0,0 0 0 0 379.242,309.438" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M752.42,309.438 L752.42,319.438 L762.42,319.438 L752.42,309.438" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="385.242" y="326.504" fill="#000" font-size="13" textLength="362.178">Não se usa actions/setup-dotnet: os downloads passam</text><text x="385.242" y="341.637" fill="#000" font-size="13" textLength="344.76">por aka.ms para dotnetorigin.blob.core.windows.net,</text><text x="385.242" y="356.77" fill="#000" font-size="13" textLength="307.347">que responde 409 (actions/setup-dotnet#794).</text><text x="385.242" y="371.903" fill="#000" font-size="13" textLength="305.075">Uma versão exata evita a pesquisa no aka.ms.</text><rect x="75.564" y="313.75" width="283.678" height="61.906" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="85.564" y="334.889" fill="#000" font-size="12" textLength="116.291">Instalar o SDK .NET</text><text x="85.564" y="348.857" fill="#000" font-size="12" textLength="221.32">dotnet-install.sh --jsonfile global.json</text><text x="85.564" y="362.826" fill="#000" font-size="12" textLength="263.678">(builds.dotnet.microsoft.com, versão exata)</text><rect x="116.847" y="404.281" width="201.113" height="33.969" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.847" y="425.42" fill="#000" font-size="12" textLength="181.113">dotnet tool restore (dotnet-ef)</text><rect x="164.352" y="473.25" width="106.104" height="33.969" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.352" y="494.389" fill="#000" font-size="12" textLength="86.104">dotnet restore</text><rect x="94.019" y="534.203" width="246.77" height="47.938" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.019" y="555.342" fill="#000" font-size="12" textLength="213.346">dotnet build -c Release --no-restore</text><text x="104.019" y="569.311" fill="#000" font-size="12" textLength="226.77">avisos são erros; regenera o openapi/</text><rect x="38" y="609.125" width="358.807" height="47.938" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48" y="630.264" fill="#000" font-size="12" textLength="193.459">dotnet test -c Release --no-build</text><text x="48" y="644.232" fill="#000" font-size="12" textLength="338.807">unitários + integração com Testcontainers (PostgreSQL)</text><rect x="53.697" y="692.063" width="327.412" height="47.938" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.697" y="713.201" fill="#000" font-size="12" textLength="307.412">git diff --exit-code -- src/SportsBooking.Api/openapi</text><text x="63.697" y="727.17" fill="#000" font-size="12" textLength="126.51">(OpenAPI atualizado)</text><rect x="58.736" y="775" width="317.334" height="47.938" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68.736" y="796.139" fill="#000" font-size="12" textLength="297.334">dotnet ef migrations has-pending-model-changes</text><text x="68.736" y="810.107" fill="#000" font-size="12" textLength="215.215">(modelo EF sem migração em falta)</text><rect x="53.105" y="857.938" width="328.596" height="47.938" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.105" y="879.076" fill="#000" font-size="12" textLength="308.596">dotnet package list --vulnerable --include-transitive</text><text x="63.105" y="893.045" fill="#000" font-size="12" textLength="192.568">falha se houver "vulnerabilities"</text><rect x="782.42" y="236.422" width="633.427" height="657.203" fill="none" style="stroke:#888;stroke-width:1.5;"/><path d="M1410.847,236.422 L1410.847,245.719 L1400.84