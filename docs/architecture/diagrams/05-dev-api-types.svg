i/schema"</text><rect x="101.714" y="535.531" width="227.656" height="33.969" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.714" y="556.67" fill="#000" font-size="12" textLength="207.656">Commit dos dois ficheiros gerados</text><rect x="123.221" y="637.902" width="184.643" height="75.875" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="133.221" y="659.041" fill="#000" font-size="12" textLength="164.643">CI falha: git diff --exit-code;</text><text x="140.85" y="673.01" fill="#000" font-size="12" textLength="25.916">stop</text><text x="133.221" y="686.979" fill="#000" font-size="12" textLength="59.83">else (não)</text><text x="140.85" y="700.947" fill="#000" font-size="12" textLength="54.193">:CI verde</text><ellipse cx="215.542" cy="744.777" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="215.542" cy="744.777" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="105.628,589.5,325.456,589.5,337.456,601.5,325.456,613.5,105.628,613.5,93.628,601.5,105.628,589.5" fill="#FFF" style="stroke:#1168BD;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="219.542" y="623.71" fill="#000" font-size="11" textLength="19.502">sim</text><text x="105.628" y="605.308" fill="#000" font-size="11" textLength="219.828">CI: o documento ou os tipos mudariam?</text><line x1="215.542" y1="93.938" x2="215.542" y2="113.938" style="stroke:#555;stroke-width:1;"/><polygon points="211.542,103.938,215.542,113.938,219.542,103.938,215.542,107.938" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.542" y1="161.875" x2="215.542" y2="181.875" style="stroke:#555;stroke-width:1;"/><polygon points="211.542,171.875,215.542,181.875,219.542,171.875,215.542,175.875" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.542" y1="243.781" x2="215.542" y2="263.