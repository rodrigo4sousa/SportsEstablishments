<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1723px;height:416px;background:#FFFFFE;" width="1723px" height="416px" viewBox="0 0 1723 416" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1723" height="416" fill="#FFFFFE" style="stroke:none;"/><g class="title" data-source-line="7"><text x="675.591" y="23.132" fill="#1F2933" font-size="14" textLength="364.841" font-weight="700" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Development view - dependency injection composition</text></g><!--entity PROG--><g class="entity" data-qualified-name="PROG" id="ent0001" data-source-line="11"><rect x="703.72" y="44.099" width="390.405" height="68.296" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="713.72" y="67.23" fill="#1F2933" font-size="14" textLength="71.572" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Program.cs</text><text x="713.72" y="83.329" fill="#1F2933" font-size="14" textLength="223.323" font-family="Arial, Liberation Sans, Helvetica, sans-serif">WebApplication.CreateBuilder(args)</text><text x="713.72" y="99.428" fill="#1F2933" font-size="14" textLength="370.405" font-family="Arial, Liberation Sans, Helvetica, sans-serif">(in the OpenAPI generator: in-memory placeholder settings)</text></g><!--entity ADDAPP--><g class="entity" data-qualified-name="ADDAPP" id="ent0002" data-source-line="12"><rect x="11.5" y="204.499" width="360.833" height="68.296" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="21.5" y="227.63" fill="#1F2933" font-size="14" textLength="102.724" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddApplication()</text><text x="21.5" y="243.729" fill="#1F2933" font-size="14" textLength="278.578" font-family="Arial, Liberation Sans, Helvetica, sans-serif">validators (Singleton) and services (Scoped):</text><text x="21.5" y="259.828" fill="#1F2933" font-size="14" textLength="340.833" font-family="Arial, Liberation Sans, Helvetica, sans-serif">OwnedClubs, BookingService, ClubBookingService, …</text></g><!--entity ADDINF--><g class="entity" data-qualified-name="ADDINF" id="ent0003" data-source-line="13"><rect x="407.29" y="204.499" width="359.254" height="68.296" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="417.29" y="227.63" fill="#1F2933" font-size="14" textLength="154.068" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddInfrastructure(config)</text><text x="417.29" y="243.729" fill="#1F2933" font-size="14" textLength="339.254" font-family="Arial, Liberation Sans, Helvetica, sans-serif">TimeProvider.System, AppDbContext, IAppDbContext,</text><text x="417.29" y="259.828" fill="#1F2933" font-size="14" textLength="329.937" font-family="Arial, Liberation Sans, Helvetica, sans-serif">I*Store, IPitchLock, DemoDataSeeder, HealthChecks</text></g><!--entity ADDACC--><g class="entity" data-qualified-name="ADDACC" id="ent0004" data-source-line="14"><rect x="7" y="349.889" width="339.84" height="52.197" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="373.02" fill="#1F2933" font-size="14" textLength="319.84" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddAccounts · Identity, IAccountStore, admin seed,</text><text x="17" y="389.119" fill="#1F2933" font-size="14" textLength="259.123" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Data Protection, PasswordHasherOptions</text></g><!--entity ADDSES--><g class="entity" data-qualified-name="ADDSES" id="ent0005" data-source-line="15"><rect x="381.61" y="349.889" width="410.626" height="52.197" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="391.61" y="373.02" fill="#1F2933" font-size="14" textLength="275.454" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddSessions · JwtOptions, ISessionService,</text><text x="391.61" y="389.119" fill="#1F2933" font-size="14" textLength="390.626" font-family="Arial, Liberation Sans, Helvetica, sans-serif">PublicSiteOptions, IPasswordResetStore, AccountEmailBuilder</text></g><!--entity ADDMAIL--><g class="entity" data-qualified-name="ADDMAIL" id="ent0006" data-source-line="16"><rect x="827.68" y="349.889" width="372.488" height="52.197" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="837.68" y="373.02" fill="#1F2933" font-size="14" textLength="352.488" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddEmail · EmailOptions, OutboxOptions, IEmailSender,</text><text x="837.68" y="389.119" fill="#1F2933" font-size="14" textLength="332.247" font-family="Arial, Liberation Sans, Helvetica, sans-serif">OutboxProcessor, OutboxDispatcher (HostedService)</text></g><!--entity ADDAPI--><g class="entity" data-qualified-name="ADDAPI" id="ent0007" data-source-line="17"><rect x="801.71" y="196.449" width="404.412" height="84.395" fill="#FFF" style="stroke:#9CA3AF;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="811.71" y="219.58" fill="#1F2933" font-size="14" textLength="160.645" font-family="Arial, Liberation Sans, Helvetica, sans-serif">The API's own extensions</text><text x="811.71" y="235.679" fill="#1F2933" font-size="14" textLength="384.412" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddApiProblemDetails, AddOriginCheck, AddApiRateLimiting,</text><text x="811.71" y="251.778" fill="#1F2933" font-size="14" textLength="178.22" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AddCookieJwtAuthentication</text><text x="811.71" y="267.876" fill="#1F2933" font-size="14" textLength="366.536" font-family="Arial, Liberation Sans, Helvetica, sans-serif">(AddControllers and AddOpenApi belong to the framework)</text></g><!--entity PIPE--><g class="entity" data-qualified-nam