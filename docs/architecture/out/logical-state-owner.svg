<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1337px;height:333px;background:#FFFFFE;" width="1337px" height="333px" viewBox="0 0 1337 333" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1337" height="333" fill="#FFFFFE" style="stroke:none;"/><g class="title" data-source-line="7"><text x="386.404" y="22.995" fill="#1F2933" font-size="14" textLength="557.354" font-weight="700" font-family="DejaVu Sans">Estados de um dono (D-USER com perfil Owner) · users.deactivated_at</text></g><g class="entity" data-qualified-name="Ativo" id="ent0001" data-source-line="10"><rect x="423.1" y="266.487" width="165.195" height="52.594" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="423.1" y1="292.784" x2="588.295" y2="292.784" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="487.794" y="284.482" fill="#1F2933" font-size="14" textLength="35.807" font-family="DejaVu Sans">Ativo</text><text x="428.1" y="310.779" fill="#1F2933" font-size="14" textLength="145.195" font-family="DejaVu Sans">deactivated_at vazio</text></g><g class="entity" data-qualified-name="Desativado" id="ent0002" data-source-line="11"><rect x="7" y="44.297" width="297.402" height="85.188" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="70.594" x2="304.402" y2="70.594" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="116.22" y="62.292" fill="#1F2933" font-size="14" textLength="78.962" font-family="DejaVu Sans">Desativado</text><text x="12" y="88.589" fill="#1F2933" font-size="14" textLength="187.182" font-family="DejaVu Sans">deactivated_at preenchido</text><text x="12" y="104.886" fill="#1F2933" font-size="14" textLength="157.958" font-family="DejaVu Sans">sem login nem refresh</text><text x="12" y="121.183" fill="#1F2933" font-size="14" textLength="277.402" font-family="DejaVu Sans">clubes escondidos, sem novas reservas</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="13"><ellipse cx="1062.7" cy="86.887" rx="10" ry="10" fill="#1F2933" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="20"><path d="M655.96,51.627 L655.96,82.887 L304.67,86.887 L655.96,90.887 L655.96,122.158 A0,0 0 0 0 655.96,122.158 L1017.442,122.158 A0,0 0 0 0 1017.442,122.158 L1017.442,61.627 L1007.442,51.627 L655.96,51.627 A0,0 0 0 0 655.96,51.627" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><path d="M1007.442,51.627 L1007.442,61.627 L1017.442,61.627 L1007.442,51.627" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><text x="661.96" y="68.694" fill="#1F2933" font-size="13" textLength="340.482" font-family="DejaVu Sans">Tudo numa transação; o UPDATE condicional decide</text><text x="661.96" y="83.827" fill="#1F2933" font-size="13" textLength="286.279" font-family="DejaVu Sans">(0 linhas = já estava assim, nada é escrito).</text><text x="661.96" y="98.959" fill="#1F2933" font-size="13" textLength="321.972" font-family="DejaVu Sans">Nenhuma reserva é cancelada. O access token já</text><text x="661.96" y="114.092" fill="#1F2933" font-size="13" textLength="215.865" font-family="DejaVu Sans">emitido dura até 15 min (aceite).</text></g><!--link *start* to Ativo--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="13" data-link-type="dependency"><path d="M1058.49,96.367 C1053.68,105.397 1045.12,119.727 1034.7,129.487 C965.65,194.137 939.8,204.687 850.7,236.487 C764.43,267.277 664.882,280.552 593.652,286.622" style="stroke:#6B7280;stroke-width:1;" fill="none" id="*start*-to-Ativo"/><polygon points="588.67,287.047,597.977,290.268,593.652,286.622,597.298,282.297,588.67,287.047" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1001.99" y="195.054" fill="#1F2933" font-size="13" textLength="319.173" font-family="DejaVu Sans">AccountRegistrationService.RegisterOwnerAsync</text><text x="1104.01" y="210.187" fill="#1F2933" font-size="13" textLength="115.134" font-family="DejaVu Sans">(ou o seed-demo)</text></g><!--link Ativo to Desativado--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="14" data-link-type="dependency"><path d="M505.47,266.207 C503.77,236.277 496.25,187.307 466.7,159.487 C442.45,136.647 377.285,120.328 309.765,108.528" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Ativo-to-Desativado"/><polygon points="304.84,107.667,313.017,113.157,309.765,108.528,314.394,105.276,304.84,107.667" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="529.303" y="172.554" fill="#1F2933" font-size="13" textLength="287.041" font-family="DejaVu Sans">AdminOwnerStatusService.DeactivateAsync</text><text x="502.83" y="187.687" fill="#1F2933" font-size="13" textLength="339.987" font-family="DejaVu Sans">→ IOwnerStatusStore.TryChangeAsync(Deactivated)</text><text x="534.514" y="202.819" fill="#1F2933" font-size="13" textLength="276.618" font-family="DejaVu Sans">UPDATE … WHERE deactivated_at IS NULL</text><text x="561.149" y="217.952" fill="#1F2933" font-size="13" textLength="223.349" font-family="DejaVu Sans">+ linha em owner_status_changes</text><text x="555.779" y="233.085" fill="#1F2933" font-size="13" textLength="234.089" font-family="DejaVu Sans">+ revoga os refresh tokens do dono</text></g><!--link Desativado to Ativo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="15" data-link-type="dependency"><path d="M139.64,129.757 C130.01,162.637 123.91,207.557 148.7,236.487 C183.29,276.847 323.582,287.841 417.822,290.771" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Desativado-to-Ativo"/><polygon points="422.