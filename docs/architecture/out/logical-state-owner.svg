r_status_changes</text><text x="524.122" y="231.477" fill="#1F2933" font-size="13" textLength="204.883" font-family="Arial, Liberation Sans, Helvetica, sans-serif">+ revoga os refresh tokens do dono</text></g><!--link Desativado to Ativo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="15" data-link-type="dependency"><path d="M125.22,128.719 C115.7,161.279 109.65,205.769 134.12,234.489 C167.8,274.039 306.763,285.124 396.823,288.274" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Desativado-to-Ativo"/><polygon points="401.82,288.449,392.965,284.136,396.823,288.274,392.686,292.132,401.82,288.449" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="153.89" y="179.182" fill="#1F2933" font-size="13" textLength="255.772" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AdminOwnerStatusService.ReactivateAsync</text><text x="184.962" y="194.131" fill="#1F2933" font-size="13" textLength="193.629" font-family="Arial, Liberation Sans, Helvetica, sans-serif">→ TryChangeAsync(Reactivated)</text><text x="135.12" y="209.08" fill="#1F2933" font-size="13" textLength="293.313" font-family="Arial, Liberation Sans, Helvetica, sans-serif">UPDATE … WHERE deactivated_at IS NOT NULL</text><text x="182.95" y="224.029" fill="#1F2933" font-size="13" textLength="197.653" font-family="Arial, Liberation Sans, Helvetica, sans-serif">+ linha em owner_status_changes</text></g><!--link Ativo to Ativo--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-source-line="16" data-link-type="dependency"><path d="M550.37,273.099 C570.04,274.099 584.94,279.929 584.94,290.589 C584.94,301.249 575.034,306.825 555.364,307.825" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Ativo-to-Ativo"/><polygon points="550.37,308.079,559.561,311.617,555.364,307.825,559.155,303.627,550.37,308.079" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;str