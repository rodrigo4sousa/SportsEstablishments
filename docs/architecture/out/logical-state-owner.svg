<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1172px;height:330px;background:#FFFFFE;" width="1172px" height="330px" viewBox="0 0 1172 330" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1172" height="330" fill="#FFFFFE" style="stroke:none;"/><g class="title" data-source-line="7"><text x="290.918" y="23.132" fill="#1F2933" font-size="14" textLength="583.461" font-weight="700" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Logical view - states of an owner (account with the Owner profile): users.deactivated_at</text></g><g class="entity" data-qualified-name="Active" id="ent0001" data-source-line="10"><rect x="371.19" y="264.489" width="153.082" height="52.197" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="371.19" y1="290.587" x2="524.272" y2="290.587" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="428.669" y="282.62" fill="#1F2933" font-size="14" textLength="38.124" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Active</text><text x="376.19" y="308.719" fill="#1F2933" font-size="14" textLength="133.082" font-family="Arial, Liberation Sans, Helvetica, sans-serif">deactivated_at empty</text></g><g class="entity" data-qualified-name="Deactivated" id="ent0002" data-source-line="11"><rect x="7" y="44.099" width="211.468" height="84.395" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="70.197" x2="218.468" y2="70.197" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="75.769" y="62.23" fill="#1F2933" font-size="14" textLength="73.931" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Deactivated</text><text x="12" y="88.329" fill="#1F2933" font-size="14" textLength="113.634" font-family="Arial, Liberation Sans, Helvetica, sans-serif">deactivated_at set</text><text x="12" y="104.428" fill="#1F2933" font-size="14" textLength="112.841" font-family="Arial, Liberation Sans, Helvetica, sans-serif">no login or refresh</text><text x="12" y="120.526" fill="#1F2933" font-size="14" textLength="191.468" font-family="Arial, Liberation Sans, Helvetica, sans-serif">clubs hidden, no new bookings</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="13"><ellipse cx="928.73" cy="86.299" rx="10" ry="10" fill="#1F2933" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="20"><path d="M545.98,51.399 L545.98,82.299 L218.85,86.299 L545.98,90.299 L545.98,121.194 A0,0 0 0 0 545.98,121.194 L883.487,121.194 A0,0 0 0 0 883.487,121.194 L883.487,61.399 L873.487,51.399 L545.98,51.399 A0,0 0 0 0 545.98,51.399" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><path d="M873.487,51.399 L873.487,61.399 L883.487,61.399 L873.487,51.399" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><text x="551.98" y="68.592" fill="#1F2933" font-size="13" textLength="316.507" font-family="Arial, Liberation Sans, Helvetica, sans-serif">All in one transaction; the conditional UPDATE decides</text><text x="551.98" y="83.541" fill="#1F2933" font-size="13" textLength="283.607" font-family="Arial, Liberation Sans, Helvetica, sans-serif">(0 rows = already in that state, nothing is written).</text><text x="551.98" y="98.49" fill="#1F2933" font-size="13" textLength="292.665" font-family="Arial, Liberation Sans, Helvetica, sans-serif">No booking is cancelled. The access token already</text><text x="551.98" y="113.439" fill="#1F2933" font-size="13" textLength="211.72" font-family="Arial, Liberation Sans, Helvetica, sans-serif">issued lasts up to 15 min (accepted).</text></g><!--link *start* to Active--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="13" data-link-type="dependency"><path d="M924.27,95.449 C919.25,104.199 910.5,118.209 900.73,128.489 C846.98,185.069 832.27,203.299 760.73,234.489 C684.61,267.679 594.804,280.487 529.594,285.737" style="stroke:#6B7280;stroke-width:1;" fill="none" id="*start*-to-Active"/><polygon points="524.61,286.139,533.902,289.403,529.594,285.737,533.26,281.429,524.61,286.139" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="870.9" y="194.182" fill="#1F2933" font-size="13" textLength="285.397" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AccountRegistrationService.RegisterOwnerAsync</text><text x="969.165" y="209.131" fill="#1F2933" font-size="13" textLength="88.867" font-family="Arial, Liberation Sans, Helvetica, sans-serif">(or seed-demo)</text></g><!--link Active to Deactivated--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="14" data-link-type="dependency"><path d="M447.37,264.029 C445.52,234.389 437.85,186.109 408.73,158.489 C381.31,132.489 297.106,114.116 223.746,102.266" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Active-to-Deactivated"/><polygon points="218.81,101.469,227.057,106.853,223.746,102.266,228.333,98.955,218.81,101.469" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="470.298" y="171.682" fill="#1F2933" font-size="13" textLength="255.772" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AdminOwnerStatusService.DeactivateAsync</text><text x="444.65" y="186.631" fill="#1F2933" font-size="13" textLength="307.068" font-family="Arial, Liberation Sans, Helvetica, sans-serif">→ IOwnerStatusStore.TryChangeAsync(Deactivated)</text><text x="467.054" y="201.58" fill="#1F2933" font-size="13" textLength="262.26" font-family="Arial, Liberation Sans, Helvetica, sans-serif">UPDATE … WHERE deactivated_at IS NULL</text><text x="506.587" y="216.529" fill="#1F2933" font-size="13" textLength="183.193" font-family="Arial, Liberation Sans, Helvetica, sans-serif">+ row in owner_status_changes</text><text x="491.988" y="231.477" fill="#1F2933" font-size="13" textLength="212.393" font-family="Arial, Liberation Sans, Helvetica, sans-serif">+ revokes the owner's refresh tokens</text></g><!--link Deactivated to Active--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk6" data-source-line="15" data-link-type="dependency"><path d="M96.84,128.719 C87.32,161.279 81.26,205.769 105.73,234.489 C139.13,273.689 275.883,284.918 366.083,288.178" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Deactivated-to-Active"/><polygon points="371.08,288.359,362.23,284.036,366.083,288.178,361.941,292.031,371.08,288.359" fill="#6B7280" style="stroke:#6B7280;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="125.5" y="179.182" fill="#1F2933" font-size="13" textLength="255.772" font-family="Arial, Liberation Sans, Helvetica, sans-serif">AdminOwnerStatusService.ReactivateAsync</text><text x="156.572" y="194.131" fill="#1F2933" font-size="13" textLength="193.629" font-family="Arial, Liberation Sans, Helvetica, sans-serif">→ TryChangeAsync(Reactivated)</text><text x="106.73" y="209.08" fill="#1F2933" font-size="13" textLength="293.313" font-family="Arial, Liberation Sans, Helvetica, sans-serif">UPDATE … WHERE deactivated_at IS NOT NULL</text><text x="161.79" y="224.029" fill="#1F2933" font-size="13" textLength="183.193" font-family="Arial, Liberation Sans, Helvetica, sans-serif">+ row in owner_status_changes</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-source-line="16" data-link-type="dependency"><path d="M524.63,273.139 C544.4,274.249 559.27,280.069 559.27,290.589 C559.27,301.109 549.392,306.648 529.622,307.758" style="stroke:#6B7280;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="524.63,308.039,533.84,311.528,529.622,307.758,533.392,303.54,524.63,308.039" fill="#6B7280" style="stroke:#