<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1215px;height:330px;background:#FFFFFE;" width="1215px" height="330px" viewBox="0 0 1215 330" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1215" height="330" fill="#FFFFFE" style="stroke:none;"/><g class="title" data-source-line="7"><text x="367.306" y="23.132" fill="#1F2933" font-size="14" textLength="473.765" font-weight="700" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Estados de um dono (D-USER com perfil Owner) · users.deactivated_at</text></g><g class="entity" data-qualified-name="Ativo" id="ent0001" data-source-line="10"><rect x="402.3" y="264.489" width="147.641" height="52.197" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="402.3" y1="290.587" x2="549.941" y2="290.587" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="460.558" y="282.62" fill="#1F2933" font-size="14" textLength="31.124" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Ativo</text><text x="407.3" y="308.719" fill="#1F2933" font-size="14" textLength="127.641" font-family="Arial, Liberation Sans, Helvetica, sans-serif">deactivated_at vazio</text></g><g class="entity" data-qualified-name="Desativado" id="ent0002" data-source-line="11"><rect x="7" y="44.099" width="268.233" height="84.395" fill="#E4EEF9" style="stroke:#6B95C4;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="70.197" x2="275.233" y2="70.197" style="stroke:#6B95C4;stroke-width:0.5;"/><text x="106.096" y="62.23" fill="#1F2933" font-size="14" textLength="70.041" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Desativado</text><text x="12" y="88.329" fill="#1F2933" font-size="14" textLength="164.233" font-family="Arial, Liberation Sans, Helvetica, sans-serif">deactivated_at preenchido</text><text x="12" y="104.428" fill="#1F2933" font-size="14" textLength="138.503" font-family="Arial, Liberation Sans, Helvetica, sans-serif">sem login nem refresh</text><text x="12" y="120.526" fill="#1F2933" font-size="14" textLength="248.233" font-family="Arial, Liberation Sans, Helvetica, sans-serif">clubes escondidos, sem novas reservas</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="13"><ellipse cx="971.12" cy="86.299" rx="10" ry="10" fill="#1F2933" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="20"><path d="M597.7,51.399 L597.7,82.299 L275.44,86.299 L597.7,90.299 L597.7,121.194 A0,0 0 0 0 597.7,121.194 L926.536,121.194 A0,0 0 0 0 926.536,121.194 L926.536,61.399 L916.536,51.399 L597.7,51.399 A0,0 0 0 0 597.7,51.399" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><path d="M916.536,51.399 L916.536,61.399 L926.536,61.399 L916.536,51.399" style="stroke:#9CA3AF;stroke-width:0.5;" fill="#FAFAFA"/><text x="603.7" y="68.592" fill="#1F2933" font-size="13" textLength="307.836" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Tudo numa transação; o UPDATE condicional decide</text><text x="603.7" y="83.541" fill="#1F2933" font-size="13" textLength="250.371" font-family="Arial, Liberation Sans, Helvetica, sans-serif">(0 linhas = já estava assim, nada é escrito).</text><text x="603.7" y="98.49" fill="#1F2933" font-size="13" textLength="287.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif">Nenhuma reserva é cancelada. O access token já</text><text x="603.7" y="113.439" fill="#1F2933" font-size="13" textLength="186.424" font-family="Arial, Liberation Sans, Helvetica, sans-serif">emitido dura até 15 min (aceite).</text></g><!--link *start* to Ativo--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="13" data-link-type="dependency"><path d="M966.97,95.549 C962.25,104.389 953.94,118.479